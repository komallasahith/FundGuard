<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1e3a8a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Security Shield -->
  <path d="M24 4L7 11V23C7 33.5 14.3 43.1 24 45.5C33.7 43.1 41 33.5 41 23V11L24 4Z" 
        fill="url(#shieldGrad)" 
        stroke="#ffffff" 
        stroke-width="1.5"
        filter="url(#glow)" />

  <!-- Inner Protective Shield Border -->
  <path d="M24 8L11 13.5V23C11 31.2 16.6 38.8 24 41.2C31.4 38.8 37 31.2 37 23V13.5L24 8Z" 
        fill="none" 
        stroke="#93c5fd" 
        stroke-width="1" 
        stroke-opacity="0.6" />

  <!-- Central Government Star & Checkmark -->
  <path d="M24 14L26.5 19.5L32.5 20.2L28 24.3L29.2 30.2L24 27.2L18.8 30.2L20 24.3L15.5 20.2L21.5 19.5L24 14Z" 
        fill="url(#goldGrad)" 
        stroke="#ffffff" 
        stroke-width="0.8" />

  <!-- Forensic Audit Eye / Check Ring -->
  <circle cx="24" cy="22.5" r="3" fill="#ffffff" />
  <circle cx="24" cy="22.5" r="1.5" fill="#1e40af" />
</svg>